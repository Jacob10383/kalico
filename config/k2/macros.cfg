[respond]

[gcode_macro HEATER_INTERRUPT]
rename_existing: HEATER_INTERRUPT_BASE
gcode:
  HEATER_INTERRUPT_BASE

# ----------------------------------------------------------------------
# Utilities
# ----------------------------------------------------------------------
[gcode_macro STATUS_MSG]
gcode:
  {% set MESSAGE = params.MSG|default('')|string %}
  {% set TYPE = params.TYPE|default('echo')|string %}
  {% set PREFIX = params.PREFIX|default('')|string %}
  {% set DISPLAY = params.DISPLAY|default('yes')|lower in ['yes', 'true', '1'] %}
  {% if DISPLAY %}
    M117 {MESSAGE}
  {% endif %}
  {% if TYPE == "error" %}
    RESPOND TYPE=error MSG="{MESSAGE}"
  {% else %}
    RESPOND PREFIX="{PREFIX}" MSG="{MESSAGE}"
  {% endif %}

[gcode_macro HOME_IF_NEEDED]
description: Homes axes when needed. Usage: HOME_IF_NEEDED [AXIS=<x|y|z|xy|xyz|etc>]
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set axis = params.AXIS|default("xyz")|lower %}

  {% set needs_x = "x" in axis and "x" not in homed %}
  {% set needs_y = "y" in axis and "y" not in homed %}
  {% set needs_z = "z" in axis and "z" not in homed %}

  {% if needs_z %}
    G28 Z
  {% elif needs_x or needs_y %}
    G28 X Y
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
  SAVE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1
  SET_VELOCITY_LIMIT VELOCITY=800 SQUARE_CORNER_VELOCITY=5 ACCEL=8000 ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE_ORIG {rawparams}
  RESTORE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1 MOVE=0

# ----------------------------------------------------------------------
# Pause / Resume / Cancel / End print
# ----------------------------------------------------------------------
[gcode_macro _PAUSE_CONTEXT]
description: Saved pause state for RESUME: print Z, original nozzle target, and user cooling.
variable_z: 0.0
variable_nozzle_temp: 0
variable_part_cooling: 0.0
variable_aux_fans: 0.0
gcode:

[gcode_macro _PAUSE_Z_MOVE]
description: Move Z +25mm and clamps so the final Z never exceeds 350.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set lift = params.LIFT|default(25.0)|float %}
  {% if current_z + lift > 350.0 %}
    {% set lift = 350.0 - current_z %}
  {% endif %}
  {% if lift < 0 %}
    {% set lift = 0 %}
  {% endif %}
  {% if lift > 0 %}
    SAVE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
    G91
    G1 Z{lift} F1000
    RESTORE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
  {% endif %}

[gcode_macro _END_PRINT_Z_MOVE]
description: Start from current Z + 50, floor that at 100, cap it at 350, and only move upward.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set target_z = current_z + 50.0 %}
  {% if target_z < 100.0 %}
    {% set target_z = 100.0 %}
  {% endif %}
  {% if target_z > 350.0 %}
    {% set target_z = 350.0 %}
  {% endif %}
  {% if target_z > current_z %}
    SAVE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
    G90
    G1 Z{target_z} F1800
    RESTORE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
  {% endif %}

[gcode_macro PAUSE]
description: Save resume state, call PAUSE_BASE, drop nozzle target to 140C, retract 3mm, lift/wipe/park, then shut off user cooling.
rename_existing: PAUSE_BASE
gcode:
  {% set already_paused = printer.pause_resume.is_paused|lower == 'true' %}
  {% set sd_active = printer.virtual_sdcard.is_active|lower == 'true' %}
  {% set stale_pause = already_paused and sd_active %}
  {% if stale_pause %}
    RESPOND TYPE=error MSG="Clearing stale pause"
    CLEAR_PAUSE
  {% endif %}
  {% if stale_pause or not already_paused %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=z VALUE={printer.toolhead.position.z|float}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=nozzle_temp VALUE={printer.extruder.target|int}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=part_cooling VALUE={printer.fan.speed|float}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=aux_fans VALUE={printer["fan_generic aux_fans"].speed|float}
    PAUSE_BASE
    M400
    {% if printer.extruder.can_extrude|lower == 'true' %}
      SAVE_GCODE_STATE NAME=PAUSE_RETRACT_STATE
      M83
      G1 E-3.0 F1800
      RESTORE_GCODE_STATE NAME=PAUSE_RETRACT_STATE
    {% else %}
      RESPOND TYPE=error MSG="Skipping pause retract: extruder below minimum extrusion temperature"
    {% endif %}
    M104 S140
    _PAUSE_Z_MOVE
    BOX_NOZZLE_CLEAN
    BOX_GO_TO_EXTRUDE_POS
    M107
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% endif %}

[gcode_macro RESUME]
description: Reject if extruder fault still latched, else reheat to saved target or 240C fallback, move to paused Z + 5, prime 30mm, run _FLUSH_CLEAN_SNAP, recheck extruder fault, then call RESUME_BASE.
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused|lower == 'true' %}
    REQUIRE_EXTRUDER_CLEAR
    {% set resume_temp = printer["gcode_macro _PAUSE_CONTEXT"].nozzle_temp|int %}
    {% if resume_temp < 170 %}
      {% set resume_temp = 240 %}
    {% endif %}
    M104 S{resume_temp}
    {% set paused_z = printer["gcode_macro _PAUSE_CONTEXT"].z|float %}
    {% set resume_z = paused_z + 5.0 %}
    {% if resume_z > 350.0 %}
      {% set resume_z = 350.0 %}
    {% endif %}
    {% if resume_z < 0.0 %}
      {% set resume_z = 0.0 %}
    {% endif %}
    {% if printer.toolhead.position.z|float != resume_z %}
      SAVE_GCODE_STATE NAME=RESUME_Z_RETURN_STATE
      G90
      G1 Z{resume_z} F1000
      RESTORE_GCODE_STATE NAME=RESUME_Z_RETURN_STATE
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={resume_temp - 3} MAXIMUM={resume_temp + 3}
    SAVE_GCODE_STATE NAME=RESUME_PRIME_STATE
    M83
    G1 E30.0 F300
    RESTORE_GCODE_STATE NAME=RESUME_PRIME_STATE
    M400
    _FLUSH_CLEAN_SNAP REtract=0
    {% set part_cooling = printer["gcode_macro _PAUSE_CONTEXT"].part_cooling|float %}
    {% set aux_fans = printer["gcode_macro _PAUSE_CONTEXT"].aux_fans|float %}
    M106 S{(part_cooling * 255.0 + 0.5)|int}
    SET_FAN_SPEED FAN=aux_fans SPEED={aux_fans}
    REQUIRE_EXTRUDER_CLEAR
    RESUME_BASE {rawparams}
  {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  END_PRINT

[gcode_macro END_PRINT]
description: Retract if hot enough, turn heaters and user cooling off, move Z with _END_PRINT_Z_MOVE, then park at the extrude position.
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% set pos = printer.toolhead.position %}
    {% set min = printer.toolhead.axis_minimum %}
    {% set max = printer.toolhead.axis_maximum %}
    {% set center_x = (min.x + max.x) / 2.0 %}
    {% set center_y = (min.y + max.y) / 2.0 %}
    {% set wipe_x = 2.0 if pos.x < center_x else -2.0 %}
    {% set wipe_y = 2.0 if pos.y < center_y else -2.0 %}
    SAVE_GCODE_STATE NAME=END_PRINT_RETRACT_STATE
    G91
    M83
    G1 X{wipe_x} Y{wipe_y} E-3.0 F1800
    RESTORE_GCODE_STATE NAME=END_PRINT_RETRACT_STATE
  {% else %}
    RESPOND TYPE=error MSG="Skipping end-print retract: extruder below minimum extrusion temperature"
  {% endif %}
  M400
  TURN_OFF_HEATERS
  M107
  SET_FAN_SPEED FAN=aux_fans SPEED=0
  _END_PRINT_Z_MOVE
  BOX_GO_TO_EXTRUDE_POS

# ----------------------------------------------------------------------
# M-code overrides
# ----------------------------------------------------------------------
[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set fan = params.P|default(0)|int %}
  {% set speed = params.S|default(255)|float %}
  {% set normalized_speed = [0.0, [speed / 255.0, 1.0]|min]|max %}
  {% if fan == 0 %}
    M106.1 S{speed}
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED={normalized_speed}
  {% elif fan == 3 %}
    RESPOND TYPE=error MSG="M106 P3 is not supported. Use M141/M191 or SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=<temp>."
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M106 P{fan}. Use P0 for part cooling or P2 for aux_fans."
  {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
  {% set fan = params.P|default(-1)|int %}
  {% if fan == -1 %}
    M107.1
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 0 %}
    M107.1
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 3 %}
    RESPOND TYPE=error MSG="M107 P3 is not supported. Use M141 S0 or SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=35."
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M107 P{fan}. Use P0 for part cooling or P2 for aux_fans."
  {% endif %}

[gcode_macro M141]
gcode:
  {% if 'S' in params|upper %}
    {% if params.S|int > 40 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S}
    {% elif params.S|int > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={params.S|default(35)}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=35
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
  {% endif %}

[gcode_macro M191]
gcode:
  {% if 'S' in params|upper %}
    {% if params.S|int > 40 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S} WAIT=1
    {% elif params.S|int > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={params.S|default(35)}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0 WAIT=1
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=35
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
  {% endif %}

[gcode_macro SET_CHAMBER_FAN]
gcode:
  {% set temp = printer["temperature_fan chamber_exhaust_fans"].temperature|int %}
  {% set target = printer["temperature_fan chamber_exhaust_fans"].target|int %}
  {% set control = printer["configfile"]["config"]["temperature_fan chamber_exhaust_fans"].control %}
  {action_respond_info("temp: %s, target: %s, control: %s" % (temp, target, control))}
  {% if control == "watermark" %}
    {% set max_delta = printer["configfile"]["config"]["temperature_fan chamber_exhaust_fans"].max_delta|int %}
    {action_respond_info("max_delta: %s" % (max_delta))}
    {% if temp >= target %}
      {% set tmp = temp + max_delta + 1 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={tmp}
      G4 P500
      M400
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={target}
    {% endif %}
  {% endif %}

# ----------------------------------------------------------------------
# Maintenance
# ----------------------------------------------------------------------
[gcode_macro LUBRICATE_RAILS]
gcode:
  {% set ITERATIONS = params.ITERATIONS|default(1)|int %}
  {% set SPEED_MM_S = params.SPEED|default(500)|float %}
  {% set SPEED_MM_MIN = SPEED_MM_S * 60 %}

  HOME_IF_NEEDED
  G1 Z10 F3000

  {% for i in range(ITERATIONS) %}
    STATUS_MSG MSG="Lubricating rails, iteration {i + 1} of {ITERATIONS}..."
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z350 F3000
    G1 X350 Y350 Z10 F3000
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
  {% endfor %}

[gcode_macro BELT_TENSION]
gcode:
  G90
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  BED_MESH_CLEAR
  BOX_MOVE_TO_SAFE_POS
  M400
  M84
  {% if 'X' in params.AXES|upper %}
    BELT_MDL_INFO MDL_NAME=mdlx
    BELT_MDL_SET MDL_NAME=mdlx MDL_N=140
  {% elif 'Y' in params.AXES|upper %}
    BELT_MDL_INFO MDL_NAME=mdly
    BELT_MDL_SET MDL_NAME=mdly MDL_N=140
  {% else %}
    BELT_MDL_INFO MDL_NAME=mdlx
    BELT_MDL_SET MDL_NAME=mdlx MDL_N=140
    BELT_MDL_INFO MDL_NAME=mdly
    BELT_MDL_SET MDL_NAME=mdly MDL_N=140
  {% endif %}
  SET_MAINTENANCE_ITEM_VARIABLE NAME=calibrate VARIABLE=belt_tensioning VALUE=0

# ----------------------------------------------------------------------
# PID calibration
# ----------------------------------------------------------------------
[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG

[gcode_macro NOZZLE_PID]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=230
  SAVE_CONFIG
  M107

[gcode_macro NOZZLE_PID_HIGH]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=320
  SAVE_CONFIG
  M107

[gcode_macro TUNOFFINPUTSHAPER]
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0

# ----------------------------------------------------------------------
# Spoolman
# ----------------------------------------------------------------------
[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}
