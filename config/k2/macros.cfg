[respond]

[gcode_macro HEATER_INTERRUPT]
rename_existing: HEATER_INTERRUPT_BASE
gcode:
  HEATER_INTERRUPT_BASE

# ----------------------------------------------------------------------
# Utilities
# ----------------------------------------------------------------------
[gcode_macro STATUS_MSG]
gcode:
  {% set MESSAGE = params.MSG|default('')|string %}
  {% set TYPE = params.TYPE|default('echo')|string %}
  {% set PREFIX = params.PREFIX|default('')|string %}
  {% set DISPLAY = params.DISPLAY|default('yes')|lower in ['yes', 'true', '1'] %}
  {% if DISPLAY %}
    M117 {MESSAGE}
  {% endif %}
  {% if TYPE == "error" %}
    RESPOND TYPE=error MSG="{MESSAGE}"
  {% else %}
    RESPOND PREFIX="{PREFIX}" MSG="{MESSAGE}"
  {% endif %}

[gcode_macro HOME_IF_NEEDED]
description: Homes axes when needed. Usage: HOME_IF_NEEDED [AXIS=<x|y|z|xy|xyz|etc>]
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set axis = params.AXIS|default("xyz")|lower %}

  {% set needs_x = "x" in axis and "x" not in homed %}
  {% set needs_y = "y" in axis and "y" not in homed %}
  {% set needs_z = "z" in axis and "z" not in homed %}

  {% if needs_z %}
    G28 Z
  {% elif needs_x or needs_y %}
    G28 X Y
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
  SAVE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1
  SET_VELOCITY_LIMIT VELOCITY=800 SQUARE_CORNER_VELOCITY=5 ACCEL=8000 ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE_ORIG {rawparams}
  RESTORE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1 MOVE=0

# ----------------------------------------------------------------------
# Pause / Resume / Cancel / End print
# ----------------------------------------------------------------------
[gcode_macro _PAUSE_CONTEXT]
description: Saved pause state for RESUME: original nozzle target and user cooling.
variable_nozzle_temp: 0
variable_part_cooling: 0.0
variable_aux_fans: 0.0
gcode:

[gcode_macro _PAUSE_Z_MOVE]
description: Move Z +25mm and clamps so the final Z never exceeds 350.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set lift = params.LIFT|default(25.0)|float %}
  {% if current_z + lift > 350.0 %}
    {% set lift = 350.0 - current_z %}
  {% endif %}
  {% if lift < 0 %}
    {% set lift = 0 %}
  {% endif %}
  {% if lift > 0 %}
    SAVE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
    G91
    G1 Z{lift} F1000
    RESTORE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
  {% endif %}

[gcode_macro _END_PRINT_Z_MOVE]
description: Start from current Z + 50, floor that at 100, cap it at 350, and only move upward.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set target_z = current_z + 50.0 %}
  {% if target_z < 100.0 %}
    {% set target_z = 100.0 %}
  {% endif %}
  {% if target_z > 350.0 %}
    {% set target_z = 350.0 %}
  {% endif %}
  {% if target_z > current_z %}
    SAVE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
    G90
    G1 Z{target_z} F1800
    RESTORE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
  {% endif %}

[gcode_macro _RETRACT_WIPE]
description: Retract while wiping 2mm toward the bed center.
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% set retract = params.RETRACT|default(3.0)|float %}
    {% set wipe = params.WIPE|default(2.0)|float %}
    {% set pos = printer.toolhead.position %}
    {% set min = printer.toolhead.axis_minimum %}
    {% set max = printer.toolhead.axis_maximum %}
    {% set wipe_x = wipe if pos.x < (min.x + max.x) / 2.0 else -wipe %}
    {% set wipe_y = wipe if pos.y < (min.y + max.y) / 2.0 else -wipe %}
    SAVE_GCODE_STATE NAME=RETRACT_WIPE_STATE
    G91
    M83
    G1 X{wipe_x} Y{wipe_y} E-{retract} F1800
    RESTORE_GCODE_STATE NAME=RETRACT_WIPE_STATE
  {% else %}
    RESPOND TYPE=error MSG="Skipping retract/wipe: extruder below minimum extrusion temperature"
  {% endif %}

[gcode_macro PAUSE]
description: Save resume state, call PAUSE_BASE, drop nozzle target to 140C, retract/wipe, lift/clean/park, then shut off user cooling.
rename_existing: PAUSE_BASE
gcode:
  {% set already_paused = printer.pause_resume.is_paused|lower == 'true' %}
  {% if not already_paused %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=nozzle_temp VALUE={printer.extruder.target|int}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=part_cooling VALUE={printer.fan.speed|float}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=aux_fans VALUE={printer["fan_generic aux_fans"].speed|float}
    PAUSE_BASE
    M400
    {% if not params.SKIP_RETRACT_WIPE|default(0)|int %}
      _RETRACT_WIPE
    {% endif %}
    M104 S140
    _PAUSE_Z_MOVE
    NOZZLE_CLEAN
    BOX_GO_TO_WASTEBIN
    M107
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% endif %}

[gcode_macro RESUME]
description: Recover interrupted Box work, reject active safety faults, restore temperature and position, then resume the print.
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused|lower == 'true' %}
    {% set recovery = printer.box.recovery %}
    {% set recovery_temp = recovery.resume_temperature|default(0, true)|int %}
    REQUIRE_EXTRUDER_CLEAR
    _BOX_RESUME_CHECK RETRY=1
    {% if 'VELOCITY' in params %}
      _RESUME_FINISH BOX_RECOVERY={1 if recovery.blocked else 0} RECOVERY_TEMP={recovery_temp} VELOCITY={params.VELOCITY}
    {% else %}
      _RESUME_FINISH BOX_RECOVERY={1 if recovery.blocked else 0} RECOVERY_TEMP={recovery_temp}
    {% endif %}
  {% endif %}

[gcode_macro _RESUME_FINISH]
gcode:
    {% set box_prepared = params.BOX_RECOVERY|int and printer.box.recovery.resume_prepared %}
    {% set resume_temp = printer["gcode_macro _PAUSE_CONTEXT"].nozzle_temp|int %}
    {% if params.RECOVERY_TEMP|int >= 170 %}
      {% set resume_temp = params.RECOVERY_TEMP|int %}
    {% endif %}
    {% if resume_temp < 170 %}
      {% set resume_temp = 240 %}
    {% endif %}
    REQUIRE_EXTRUDER_CLEAR
    _BOX_RESUME_CHECK
    M104 S{resume_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={resume_temp - 3} MAXIMUM={resume_temp + 3}
    REQUIRE_EXTRUDER_CLEAR
    _BOX_RESUME_CHECK
    {% if not box_prepared %}
      SAVE_GCODE_STATE NAME=RESUME_PRIME_STATE
      M83
      G1 E30.0 F300
      RESTORE_GCODE_STATE NAME=RESUME_PRIME_STATE
      M400
      _FLUSH_CLEAN_SNAP REtract=0
    {% endif %}
    {% set part_cooling = printer["gcode_macro _PAUSE_CONTEXT"].part_cooling|float %}
    {% set aux_fans = printer["gcode_macro _PAUSE_CONTEXT"].aux_fans|float %}
    M106 S{(part_cooling * 255.0 + 0.5)|int}
    SET_FAN_SPEED FAN=aux_fans SPEED={aux_fans}
    REQUIRE_EXTRUDER_CLEAR
    _BOX_RESUME_CHECK
    {% if 'VELOCITY' in params %}
      RESUME_BASE VELOCITY={params.VELOCITY}
    {% else %}
      RESUME_BASE
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  END_PRINT

[gcode_macro _RESET_PRINT_STATE]
description: Restore the terminal/new-print thermal, fan, motion, and G-code baseline.
gcode:
  TURN_OFF_HEATERS
  M107
  M141 S0
  M107 P3

  CLEAR_PAUSE
  RESET_VELOCITY_LIMIT
  G90
  M83
  M220 S100
  M221 S100

[gcode_macro END_PRINT]
description: Retract if hot enough, turn heaters and user cooling off, move Z with _END_PRINT_Z_MOVE, then park at the waste bin.
gcode:
  _RETRACT_WIPE
  M400
  _RESET_PRINT_STATE
  _END_PRINT_Z_MOVE
  BOX_GO_TO_WASTEBIN

# ----------------------------------------------------------------------
# M-code overrides
# ----------------------------------------------------------------------
[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set fan = params.P|default(0)|int %}
  {% set speed = params.S|default(255)|float %}
  {% set normalized_speed = [0.0, [speed / 255.0, 1.0]|min]|max %}
  {% if fan == 0 %}
    M106.1 S{speed}
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED={normalized_speed}
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED={normalized_speed}
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M106 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
  {% set fan = params.P|default(-1)|int %}
  {% if fan == -1 %}
    M107.1
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 0 %}
    M107.1
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED=0
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M107 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M141]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    {% if chamber_temp > 40 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber_temp}
    {% elif chamber_temp > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={chamber_temp}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
  {% endif %}

[gcode_macro M191]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    M141 S{chamber_temp}
    {% if chamber_temp > 40 %}
      {% set max_delta = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chamber_temp - max_delta}
    {% elif chamber_temp > 0 %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={chamber_temp}
    {% endif %}
  {% endif %}

# ----------------------------------------------------------------------
# Maintenance
# ----------------------------------------------------------------------
[gcode_macro LUBRICATE_RAILS]
gcode:
  {% set ITERATIONS = params.ITERATIONS|default(1)|int %}
  {% set SPEED_MM_S = params.SPEED|default(500)|float %}
  {% set SPEED_MM_MIN = SPEED_MM_S * 60 %}

  HOME_IF_NEEDED
  G1 Z10 F3000

  {% for i in range(ITERATIONS) %}
    STATUS_MSG MSG="Lubricating rails, iteration {i + 1} of {ITERATIONS}..."
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z350 F3000
    G1 X350 Y350 Z10 F3000
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
  {% endfor %}

[gcode_macro BELT_TENSION]
gcode:
  G90
  BED_MESH_CLEAR
  {% set axes = params.AXES|default("XY")|upper %}
  {% if 'X' in axes %}
    BELT_TENSION_SET AXIS=X TENSION=140
  {% endif %}
  {% if 'Y' in axes %}
    BELT_TENSION_SET AXIS=Y TENSION=140
  {% endif %}

# ----------------------------------------------------------------------
# PID calibration
# ----------------------------------------------------------------------
[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG

[gcode_macro NOZZLE_PID]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=230
  SAVE_CONFIG
  M107

[gcode_macro NOZZLE_PID_HIGH]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=320
  SAVE_CONFIG
  M107

[gcode_macro TUNOFFINPUTSHAPER]
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
