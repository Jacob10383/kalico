# === Host and MCUs ===

[danger_options]
log_statistics: False
log_config_file_at_startup: True
log_bed_mesh_at_startup: False
log_velocity_limit_changes: False
log_pressure_advance_changes: False
log_shutdown_info: True
log_serial_reader_warnings: True
log_startup_info: True
log_webhook_method_register_messages: False

[serial_485 serial485]
[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -30
max_temp: 100

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: -30
max_temp: 100

[duplicate_pin_override]
pins: PC5,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PA15,PA8

[telemetry]
enabled: False

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[idle_timeout]
timeout: 99999999

[force_move]
enable_force_move: true

[force_stop_homing]

[gcode_arcs]
resolution: 1.0

[exclude_object]

[display_status]

[pause_resume]


# === Motion ===

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 30000
minimum_cruise_ratio: 0.5
max_z_velocity: 30
max_z_accel: 1000
square_corner_velocity: 10

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 352.5
position_min: -4
position_max: 352.5
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.2 #No spacer
position_min: -6.2 #No spacer
position_max: 352
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 360
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[stepper_z1]
step_pin: PB15
dir_pin: PA1
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[z_tilt]
z_positions:
    -15,175
    375,175
points:
    5,175
    345,175
speed: 400
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

[z_align]
rising_dist: 5
rise_distance: 340
rise_speed: 50

[axis_twist_compensation]
calibrate_start_x: 5
calibrate_end_x: 345
calibrate_y: 176

[bed_mesh]
speed: 100
mesh_min: 5,5
mesh_max: 345,345
probe_count: 9,9
mesh_pps: 2, 2
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 5
split_delta_z: 0.01
move_check_distance: 1

[screws_tilt_adjust]
screw1: 45, 28
screw1_name: Front Left
screw2: 307, 28
screw2_name: Front Right
screw3: 307, 314
screw3_name: Rear Right
screw4: 45, 314
screw4_name: Rear Left
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4


# === Heaters ===

[thermistor my_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
min_temp: -30
max_temp: 390
control: pid
pid_kp: 14.296
pid_ki: 1.271
pid_kd: 40.206

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 37
pid_Ki: 0.18
pid_Kd: 280
min_temp: -30
max_temp: 135

[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
min_temp: -30
max_temp: 80

[ptc_power_limiter]
bed: heater_bed
chamber: heater_generic chamber_heater
# Total normalized load allowed across bed and chamber PTC.
max_combined_load: 1.0
# Load consumed when bed PWM is 100%.
bed_full_load: 1.0
# Load consumed when chamber PTC PWM is 100%.
chamber_full_load: 0.35
# Drop tiny chamber requests instead of pulsing below useful output.
minimum_useful_chamber_power: 0.20

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1


# === Fans, LEDs, and outputs ===

[fan_feedback]

[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
hardware_pwm: false
min_power: 0.10
shutdown_speed: 0

[temperature_fan chamber_exhaust_fans]
pin: PA0
cycle_time: 0.025
hardware_pwm: false
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
target_temp: 35.0
max_delta: 0.5
min_temp: -30
max_temp: 80
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 0

[temperature_fan_manual_floor chamber_exhaust_fans]

[multi_pin aux_fan_pins]
pins: PB4,PB3

[fan_generic aux_fans]
pin: multi_pin:aux_fan_pins
cycle_time: 0.025
hardware_pwm: false
min_power: 0.35
kick_start_time: 1.0
shutdown_speed: 0

[controller_fan extruder_motor_fan]
pin: nozzle_mcu:PB1
stepper: 
heater: extruder
fan_speed: 1.0
idle_timeout: 30
shutdown_speed: 0

[heater_fan heatbreak_fan]
pin: nozzle_mcu:PB7
heater: extruder
heater_temp: 60.0
fan_speed: 1.0
shutdown_speed: 1.0

[controller_fan ssr_board_fan]
pin: PB1
heater: heater_bed,chamber_heater
stepper:
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 30
shutdown_speed: 0.0

[chamber_heater_circulation_fan chamber_heater_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
# Fan speed while chamber heater PWM is active before print starts
preheat_speed: 1.0
# Fan speed while chamber heater PWM is during print(Creality always ran it at 30%)
printing_speed: 0.30

[multi_pin LED_pin]
pins: PB0,PA12

[output_pin LED]
pin: multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[led_idle_manager]
timeout: 300            # seconds of inactivity before LEDs switch off

# === Sensors ===

[filament_switch_sensor filament_sensor]
pause_on_runout: false
smart: true
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  RESPOND TYPE=echo MSG="Filament sensor runout"
  BOX_RUNOUT_CHECK

[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw
probe_points:
   175,175,10
min_freq: 20
max_freq: 120
accel_per_hz: 100

[belt_mdl mdlx]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15

[belt_mdl mdly]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15


# === Includes (overrides.cfg loads last and wins) ===

[include macros.cfg]
[include start_print.cfg]
[include toolchanger.cfg]
[include motor_control.cfg]
[include cartographer.cfg]
[include kamp.cfg]
[include timelapse.cfg]
[include overrides.cfg]
