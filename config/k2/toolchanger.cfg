[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[toolchanger]
flush_speed: 20              # mm³/s volumetric flow rate
pre_flush_speed: 15          # mm³/s for pre-flush extrusion
pre_flush_length: 63         # mm to extrude before flush
default_temp: 220            # fallback temp when no gcode data
retract_length: 30           # mm to retract before cutting
spoolman_integration: false  # enable spoolman spool tracking

[extended_zone_transform]
debug: True

[motion_limits]

[auto_addr]
box_count: 4 #Lower to actual cfs count for faster startup

[box]
pre_cut_pos_x: 10.0         # X position to return to before/after the cut stroke
#cut_pos_x: -6.5             # X position of the actual cut stroke; required for BOX_CUT
cut_pos_y: 200.0            # Y position used for the cut sequence
cut_velocity: 30000.0       # Feedrate for the cut move in mm/min
cut_pos_offset: 0.2

[save_variables]
filename: /mnt/UDISK/printer_data/toolchanger_vars.cfg

# ----------------------------------------------------------------------
# Macros
# ----------------------------------------------------------------------
[gcode_macro BOX_GO_TO_EXTRUDE_POS]
gcode:
  BOX_GO_TO_WASTEBIN

[gcode_macro BOX_NOZZLE_CLEAN]
gcode:
  NOZZLE_CLEAN

[gcode_macro CALIBRATE_CUT_POS]
rename_existing: CALIBRATE_CUT_POS_BASE
gcode:
  CALIBRATE_CUT_POS_BASE

[gcode_macro UNLOAD_FILAMENT]
rename_existing: UNLOAD_FILAMENT_BASE
description: Unload filament (heat, retract, cut, unload)
variable_ignore_min_extrude_temp: True
gcode:
  UNLOAD_FILAMENT_BASE
