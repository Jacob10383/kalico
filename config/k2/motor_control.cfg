[motor_control]
# ======================================
# xy main tweaks
# ======================================
# # x_param_stall_cur_A: 0.7  # was 0.7 - Stall detection current threshold (Amps)
x_param_stall_pos_err_rad: 0.007  # was 0.012 - Position error threshold for stall (radians)
# x_controller_pos_loop_pid_param_kp: 181  # was 100 - Position loop proportional gain
# x_controller_leso_param_z3k: 0.4  # was 0.3 - LESO disturbance observer gain
x_controller_cur_filter_param_en: 1  # was 0 - Enable current filtering (quieter)
# x_controller_cur_filter_param_fc: 5000  # was 6000 - Current filter cutoff (Hz)
# # y_param_stall_cur_A: 0.7  # was 0.7 - Stall detection current threshold (Amps)
y_param_stall_pos_err_rad: 0.007  # was 0.012 - Position error threshold for stall (radians)
# y_controller_pos_loop_pid_param_kp: 180  # was 300 - Position loop proportional gain
# y_controller_leso_param_z3k: 0.4  # was 0.5 - LESO disturbance observer gain
y_controller_cur_filter_param_en: 1  # was 0 - Enable current filtering (quieter)
# y_controller_cur_filter_param_fc: 5000  # was 6000 - Current filter cutoff (Hz)
# ======================================
# z main tweaks
# ======================================
# z_controller_pos_loop_pid_param_kp: 70  # was 100 - Position loop proportional gain
z_controller_cur_filter_param_en: 1  # was 0 - Enable current filtering (quieter)
# z_controller_cur_filter_param_fc: 5000  # was 6000 - Current filter cutoff (Hz)
# # z_protection_param_prt_peak_cur_A: 5.5  # was 999.0 - Peak current limit (Amps)
# # z_protection_param_prt_continuous_cur_A: 3.2  # was 4.0 - Continuous current limit (Amps)
# # z_protection_param_prt_continuous_time_s: 0.05  # was 1.0 - Continuous current time limit (s)
# z_protection_param_prt_track_max_err: 0.08  # was 0.3 - Max tracking error threshold
# z_protection_param_prt_track_err_time: 0.01  # was 0.1 - Tracking error time trigger (s)
# z1_controller_pos_loop_pid_param_kp: 70  # was 100 - Position loop proportional gain
z1_controller_cur_filter_param_en: 1  # was 0 - Enable current filtering (quieter)
# z1_controller_cur_filter_param_fc: 5000  # was 6000 - Current filter cutoff (Hz)
# # z1_protection_param_prt_peak_cur_A: 5.5  # was 999.0 - Peak current limit (Amps)
# # z1_protection_param_prt_continuous_cur_A: 3.2  # was 4.0 - Continuous current limit (Amps)
# # z1_protection_param_prt_continuous_time_s: 0.05  # was 1.0 - Continuous current time limit (s)
# z1_protection_param_prt_track_max_err: 0.08  # was 0.3 - Max tracking error threshold
# z1_protection_param_prt_track_err_time: 0.01  # was 0.1 - Tracking error time trigger (s)
# ======================================
# PIN SETUP
# ======================================
overcurrent_switch: 0
switch: 1
retries: 4
cut_pos_offset: 0.4
motor_closed_loop: x,y,z,z1,e
motor_x_dir: PB9,0
motor_x_step: PB10,0
motor_x_stall: PB11
motor_y_dir: !PB7,0
motor_y_step: PB8,0
motor_y_stall: PB12
motor_z_dir: PB5,0
motor_z_step: PB6,1
motor_z_stall: PB13
motor_z1_dir: PA1,1
motor_z1_step: PB15,1
motor_z1_stall: PA10
motor_e_stall: nozzle_mcu:PB12
