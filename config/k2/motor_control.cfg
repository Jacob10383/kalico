[motor_control]
cut_pos_offset: 0.4 # Added to the measured cutter hit when saving cut_pos_x.

# Runtime motor-firmware overrides.
x_param_stall_pos_err_rad: 0.007 # X stall position-error threshold, radians.
y_param_stall_pos_err_rad: 0.007 # Y stall position-error threshold, radians.
x_controller_cur_filter_param_en: 1 # Enable X current filtering.
y_controller_cur_filter_param_en: 1 # Enable Y current filtering.
z_controller_cur_filter_param_en: 1 # Enable Z current filtering.
z1_controller_cur_filter_param_en: 1 # Enable Z1 current filtering.

