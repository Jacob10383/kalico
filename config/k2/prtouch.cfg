# K2 nozzle load-cell probe (CS1237). Uses K2 pin/ADC defaults from extras/prtouch.py.

[prtouch]
z_offset: 0
register_as_probe: False
speed: 5
lift_speed: 40
samples: 1
sample_retract_dist: 2.0
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3

# PRTOUCH_HOME
home_xy: 175, 175
home_samples: 3
home_max_samples: 10
home_max_noisy: 3
home_sample_range: 0.010
home_travel_speed: 200
home_z_hop: 2
thermal_expansion: 0.00083  # mm/°C; PRTOUCH_HOME PRINT_TEMP=<C>

# PRTOUCH_SCRUB
scrub_x_start: 173
scrub_x_end: 223
scrub_y_min: 353
scrub_y_max: 356
scrub_detect_hold_ratio: 2.5
scrub_detect_deflection: 0.035
scrub_tab_depth: 0.15
scrub_no_tab_depth: 0.05
scrub_speed: 10

# Detector
pres_tri_hold: 4000, 10000, 500
pres_tri_fter: 5.0, 1.0, 0.8
pres_ded_tkms: 128

[bed_mesh]
zero_reference_position: 175, 175
speed: 300
mesh_min: 5, 5
mesh_max: 345, 345
probe_count: 11, 11
mesh_pps: 2, 2
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3
