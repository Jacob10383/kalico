# K2 nozzle load cell (CS1237 on the nozzle MCU).
# [prtouch] must stay first: it defaults the probe's values before
# [load_cell_probe] loads. Those defaults (z_offset, counts_per_gram,
# decompression_angle) hold for every K2, and without a saved
# reference_tare_counts the load cell's zero is read at startup, so a
# fresh install can probe without LOAD_CELL_CALIBRATE. Options that
# SAVE_CONFIG writes must not be set here; saved values win.

[prtouch]
lift_speed: 40
sample_retract_dist: 2.0

# PRTOUCH_HOME
home_xy: 175, 175
home_samples: 3
home_max_samples: 10
home_max_noisy: 3
home_sample_range: 0.010
home_travel_speed: 200
home_z_hop: 2
thermal_expansion: 0.00083  # mm/°C; PRTOUCH_HOME PRINT_TEMP=<C>

# PRTOUCH_SCRUB
scrub_x_start: 173
scrub_x_end: 223
scrub_y_min: 353
scrub_y_max: 356
scrub_detect_hold_ratio: 2.5
scrub_detect_deflection: 0.10
scrub_tab_depth: 0.15
scrub_no_tab_depth: 0.05
scrub_speed: 10

[load_cell_probe]
register_as_probe: False
sensor_type: cs1237
sclk_pin: nozzle_mcu:PB13
dout_pin: nozzle_mcu:PB14
sample_rate: 1280
gain: 128
trigger_force: 75
buzz_filter_cutoff_frequency: 100
bad_probe_strategy: circle
bad_probe_retries: 6
speed: 5
lift_speed: 40
samples: 1
sample_retract_dist: 2.0
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3

[bed_mesh]
zero_reference_position: 175, 175
speed: 300
mesh_min: 5, 5
mesh_max: 345, 345
probe_count: 11, 11
mesh_pps: 2, 2
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3

[pa_tester]
use_scipy: True
slow_flow: 6
high_flow: 30
purge_length: 20
