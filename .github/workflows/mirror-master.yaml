name: Mirror bleeding-edge-v2 to master
on:
  push:
    branches: [bleeding-edge-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bleeding-edge-v2
          fetch-depth: 0
      - run: git push origin HEAD:master --force
